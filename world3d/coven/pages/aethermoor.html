<title>Aethermoor in 3D</title>
<style>
/* Aethermoor in 3D: the Verdant Wilds (Coven of the Moon Faire's zone 1, borrowed), the maps, and the continent. */
html,body{margin:0;height:100%;background:#0a0b18;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#world{position:fixed;inset:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#world canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
/* the thumb's ring (phones): where it went down, and where it is */
#ring{position:absolute;display:none;width:116px;height:116px;margin:-58px 0 0 -58px;border-radius:50%;border:2px solid rgba(230,226,255,.42);background:rgba(20,18,44,.18);pointer-events:none;z-index:3}
#dot{position:absolute;left:50%;top:50%;width:40px;height:40px;border-radius:50%;background:rgba(240,236,255,.5);transform:translate(-50%,-50%);pointer-events:none}
/* top right: the numbers button (the look's button, made by the walker, sits left of it) */
#nums{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:4;appearance:none;width:46px;height:46px;border-radius:23px;border:1px solid rgba(214,222,255,.45);background:rgba(14,14,36,.62);display:grid;place-items:center;padding:0;cursor:pointer}
#nums svg{width:22px;height:22px}
#nums.on{background:rgba(70,60,130,.8);border-color:rgba(200,190,255,.75)}
/* top right, left of the look's button: who walks, and the four to choose from */
#who{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:calc(68px + env(safe-area-inset-right,0px));z-index:4;appearance:none;width:46px;height:46px;border-radius:23px;border:1px solid rgba(214,222,255,.45);background:rgba(14,14,36,.62);display:grid;place-items:center;padding:0;cursor:pointer}
#who svg{width:22px;height:22px}
#whoPanel{position:absolute;top:calc(66px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));z-index:5;display:none;flex-direction:column;gap:6px;padding:8px;border-radius:16px;background:rgba(14,12,34,.86);border:1px solid rgba(214,222,255,.3)}
#whoPanel button{appearance:none;border:1px solid rgba(214,222,255,.25);border-radius:12px;background:rgba(40,36,80,.5);color:#f0ecff;font:15px system-ui,sans-serif;padding:10px 14px;text-align:left;min-width:190px;cursor:pointer}
#whoPanel button small{display:block;color:#b8b4e0;font-size:12px}
#whoPanel button.on{background:rgba(96,80,170,.8);border-color:rgba(220,210,255,.8)}
/* top left: the map. Tap it for the big one */
#world canvas.mini{position:absolute;inset:auto;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:4;width:clamp(124px,22vmin,150px);height:clamp(124px,22vmin,150px);touch-action:manipulation;border-radius:13px;box-shadow:0 2px 12px rgba(0,0,0,.55);cursor:pointer}
/* the big map: its size is set by minimap.js, to fit the screen either way up */
#world canvas.bigmap{position:absolute;inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);z-index:8;width:auto;height:auto;touch-action:manipulation;border-radius:14px;box-shadow:0 6px 40px rgba(0,0,0,.75);cursor:pointer}
/* the foot of the screen, in the middle: the Talk button, and over it the words a person says */
.talkbtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:6;appearance:none;min-height:48px;min-width:150px;padding:10px 22px;border-radius:24px;border:1px solid rgba(255,226,160,.7);background:rgba(34,26,60,.86);color:#ffe9b8;font:600 16px Georgia,serif;cursor:pointer;box-shadow:0 2px 12px rgba(0,0,0,.45)}
.talkbox{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(74px + env(safe-area-inset-bottom,0px));z-index:6;width:min(560px,calc(100% - 28px));padding:10px 16px 12px;border-radius:14px;background:rgba(14,12,34,.84);border:1px solid rgba(214,222,255,.28);pointer-events:none}
.talkwho{color:#ffd98a;font:600 13px Georgia,serif;letter-spacing:.03em;margin-bottom:3px}
.talksaid{color:#f4f0ff;font:17px/1.35 Georgia,serif}
/* bottom left: how fast it is drawing */
#numbers{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:4;padding:6px 12px;border-radius:14px;background:rgba(10,10,28,.6);color:#e8e6ff;font-size:13px;line-height:1.35;pointer-events:none}
#numbers b{font-size:15px}
#numbers small{display:none;color:#b8b4e0;font-size:12px}
#numbers.more small{display:block}
/* top left: the herbs in Io's bag, once she has one */
#bag{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(clamp(124px,22vmin,150px) + 22px + env(safe-area-inset-top,0px));z-index:4;display:none;gap:10px;padding:7px 12px;border-radius:16px;background:rgba(14,12,34,.66);border:1px solid rgba(214,222,255,.3);color:#f0ecff;font-size:14px;pointer-events:none}
#bag span{display:inline-flex;align-items:center;gap:6px}
#bag i{width:11px;height:11px;border-radius:50%;display:inline-block;box-shadow:0 0 7px currentColor}
/* top middle: where she is, and what she found */
#toast{position:absolute;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:4;max-width:calc(100% - 190px);padding:8px 16px;border-radius:16px;background:rgba(14,12,34,.72);color:#f4f0ff;font-size:15px;line-height:1.3;text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
@media (max-width:720px){#toast{top:calc(clamp(124px,22vmin,150px) + 66px + env(safe-area-inset-top,0px));max-width:calc(100% - 40px)}}
#toast.name{font:400 22px/1.2 Georgia,"Times New Roman",serif;letter-spacing:.03em;color:#ffe6a8;background:rgba(14,12,34,.55)}
#load{position:fixed;inset:0;z-index:9;display:grid;place-content:center;text-align:center;background:#0a0b18;color:#e8e4ff;font-family:Georgia,"Times New Roman",serif;transition:opacity .6s;padding:0 24px}
#load h1{margin:0 0 6px;font-weight:400;font-size:32px;letter-spacing:.02em}
#load h2{margin:0 0 14px;font-weight:400;font-size:17px;color:#cfc8f2}
#load p{margin:0;font:15px system-ui,sans-serif;color:#b8b4e0}

/* the party bar (Aethermoor) */
#party{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;gap:6px;justify-content:center;max-width:calc(100% - 24px)}
#party button{appearance:none;min-height:44px;min-width:44px;padding:0 12px;border-radius:22px;border:1px solid rgba(255,214,150,.5);background:rgba(28,20,16,.78);color:#f4e6cc;font:600 14px Georgia,serif;cursor:pointer}
#party button.on{background:rgba(150,90,30,.9);border-color:#ffd27a;color:#fff6e0}
#numbers{bottom:calc(64px + env(safe-area-inset-bottom,0px))}
@media (max-width:720px){#party{gap:4px}#party button{padding:0 7px;font-size:12.5px;flex:1 1 auto}#numbers{font-size:12px}}
/* on the big map: the way to the whole of Aethermoor */
#toWorld{white-space:nowrap;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:9;display:none;appearance:none;min-height:48px;padding:0 22px;border-radius:24px;border:1px solid rgba(255,226,160,.8);background:rgba(34,26,60,.92);color:#ffe9b8;font:600 16px Georgia,serif;cursor:pointer;box-shadow:0 2px 14px rgba(0,0,0,.6)}
/* the continent, over everything */
#continent{position:fixed;inset:0;z-index:20;display:none;background:#0a0b18}
#continent.on{display:block}
#continent #map{position:absolute;inset:0}
#back{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:22;appearance:none;min-height:48px;padding:0 20px;border-radius:24px;border:1px solid rgba(255,226,160,.8);background:rgba(34,26,60,.92);color:#ffe9b8;font:600 16px Georgia,serif;cursor:pointer}
#cload{position:absolute;inset:0;z-index:21;display:grid;place-content:center;color:#e8e4ff;font:18px Georgia,serif;background:#0a0b18;transition:opacity .6s}

/* the 3D map of Aethermoor (continent/map/map.css) */
/* map.css: the 3D map's page: the map fills the screen, with as little on top of it as can be */
html,body{margin:0;height:100%;background:#0b0d22;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;color:#f1eeff;font:15px/1.35 "Atkinson Hyperlegible",system-ui,sans-serif}
#continent #map{position:fixed;inset:0}
#continent #map canvas{position:absolute;inset:0;display:block;touch-action:none}
/* names over the map */
.map-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.map-tag{position:absolute;left:0;top:0;white-space:nowrap;will-change:transform}
.map-tag.place,.map-tag.landing,.map-tag.zone{font-family:"IM Fell English",Georgia,serif;color:#f3eedc;text-shadow:0 0 4px #000,0 1px 3px #000,0 0 10px rgba(0,0,0,.8)}
.map-tag.place{font-size:13px;margin:-8px 0 0 0;translate:-50% -100%;opacity:.92}
.map-tag.place::after{content:"";position:absolute;left:50%;bottom:-7px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#e9e4ff;box-shadow:0 0 6px #b9b0ff}
.map-tag.place.lands{color:#ffe2a6}
.map-tag.place.lands::before{content:"◆ ";color:#ffcf6e}
.map-tag.landing{font-size:13px;translate:-50% -100%;margin-top:-10px;color:#ffe2a6}
.map-tag.landing::before{content:"◆ ";color:#ffcf6e}
.map-tag.zone{font-size:22px;letter-spacing:.06em;translate:-50% -50%;color:rgba(255,236,196,.88)}
.map-tag.io{translate:-50% -100%;margin-top:-26px;display:flex;flex-direction:column;align-items:center;gap:1px;padding:5px 12px 6px;border-radius:14px;background:rgba(18,15,44,.78);border:1px solid rgba(214,206,255,.55);box-shadow:0 0 14px rgba(150,140,255,.35)}
.map-tag.io b{font:700 14px/1 "Atkinson Hyperlegible",system-ui,sans-serif;color:#fff;letter-spacing:.04em}
.map-tag.io span{font:13px/1.15 "IM Fell English",Georgia,serif;color:#e7e2ff}
/* the place Io is in, at the top */
.chip{position:absolute;left:calc(12px + env(safe-area-inset-left,0px));top:calc(12px + env(safe-area-inset-top,0px));z-index:4;display:flex;flex-direction:column;padding:7px 14px 8px;border-radius:16px;background:rgba(14,13,36,.66);border:1px solid rgba(214,222,255,.28);max-width:calc(100% - 100px)}
.chip b{font:20px/1.1 "IM Fell English",Georgia,serif;font-weight:400}
.chip span{font-size:13px;color:#cfc9ef}
/* the two buttons */
.round{position:absolute;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:4;appearance:none;width:54px;height:54px;border-radius:27px;border:1px solid rgba(214,222,255,.45);background:rgba(14,14,36,.7);display:grid;place-items:center;padding:0}
.round svg{width:26px;height:26px}
.pill{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:4;appearance:none;padding:11px 18px;border-radius:22px;border:1px solid rgba(214,222,255,.35);background:rgba(14,14,36,.66);color:#e9e5ff;font:15px "Atkinson Hyperlegible",system-ui,sans-serif}
button{cursor:pointer}
/* the list of places to put Io in (this demo only) */
.sheet{position:fixed;inset:0;z-index:8;background:rgba(5,5,16,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.sheet-card{width:min(520px,100%);max-height:78%;display:flex;flex-direction:column;background:rgba(18,16,40,.96);border:1px solid rgba(214,206,255,.3);border-bottom:0;border-radius:20px 20px 0 0;padding:14px 14px calc(12px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;align-items:center;justify-content:space-between;padding:0 4px 6px}
.sheet-head b{font:22px "IM Fell English",Georgia,serif;font-weight:400}
.x{appearance:none;border:0;background:none;color:#cfc9ef;font-size:20px;padding:6px 10px}
.sheet-list{overflow:auto;-webkit-overflow-scrolling:touch}
.sheet-list h3{margin:12px 4px 6px;font-size:13px;font-weight:700;color:#cfc9ef;letter-spacing:.03em}
.sheet-row{display:flex;flex-wrap:wrap;gap:7px}
.place{appearance:none;padding:8px 12px;border-radius:14px;border:1px solid rgba(214,206,255,.28);background:rgba(40,36,80,.6);color:#f1eeff;font:14px "Atkinson Hyperlegible",system-ui,sans-serif}
.place.on{background:rgba(150,120,40,.75);border-color:rgba(255,226,160,.7)}
.sheet-detail{margin:14px 4px 0;font-size:13px;color:#cfc9ef}
.sheet-detail .place{padding:5px 12px;margin-left:4px}
.sheet-nums{margin:10px 4px 0;font-size:12px;color:#9e98c4}
/* the hint, and the loading screen */
.hint{position:absolute;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:4;padding:8px 14px;border-radius:16px;background:rgba(14,12,34,.72);font-size:14px;white-space:nowrap;transition:opacity .6s;pointer-events:none}
.hint.gone{opacity:0}
.load{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:#0b0d22;transition:opacity .6s}
.load.gone{opacity:0;pointer-events:none}
.load p{font:italic 20px "IM Fell English",Georgia,serif;color:#d9d4f5;text-align:center;padding:0 24px}
</style>
<div id="world"><canvas id="cv"></canvas><div id="ring"><div id="dot"></div></div>
  <button id="nums" aria-label="Show or hide the numbers"><svg viewBox="0 0 24 24" fill="none" stroke="#eee8ff" stroke-width="1.8" stroke-linecap="round"><path d="M5 19V11M12 19V5M19 19v-5"/></svg></button>
  <div id="toast"></div>
  <div id="party"></div>
  <button id="toWorld">The whole of Aethermoor</button>
  <div id="numbers"><b id="fps">…</b> frames a second<small id="more"></small></div></div>
<div id="continent"><div id="map"></div><div id="chip" class="chip" hidden><b id="chip-place"></b><span id="chip-zone"></span></div>
  <button id="find" class="round" style="top:calc(12px + env(safe-area-inset-top,0px));bottom:auto" type="button" aria-label="Find the party"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 3.2A9 9 0 1 0 20.8 15 7.2 7.2 0 0 1 15.5 3.2z" fill="#f4f0ff"/></svg></button>
  <button id="back" type="button">Back to walking</button><div id="cload">Unrolling the map of Aethermoor…</div></div>
<div id="load"><div><h1>Aethermoor</h1><h2>The Verdant Wilds, in 3D</h2><p id="loadmsg">Loading…</p></div></div>
