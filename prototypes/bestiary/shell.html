<title>Aethermoor Bestiary</title>
<style>
:root{color-scheme:dark;--ink:#0b0910;--soot:#120e0c;--soot2:#19130f;--iron2:#2b221d;--seam:#3f3229;--seam2:#5a4838;--parchment:#ecdfc3;--ash:#a8977f;--hearth:#ee8e31;--hot:#ffcb66}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--soot);color:var(--parchment);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif}
.app{display:grid;grid-template-columns:minmax(0,1fr) 400px;height:100%}
.stage{position:relative;overflow:hidden;min-height:0}#view{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.top{position:absolute;left:16px;top:12px;right:16px;pointer-events:none}.top b{display:block;font:22px Georgia,serif;color:#fff3d6}.top span{font-size:13px;color:var(--ash)}
#nums{position:absolute;right:16px;top:14px;font-size:11px;color:var(--ash)}
.inset{position:absolute;left:16px;bottom:16px;background:rgba(18,14,12,.85);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--seam);padding:6px;text-align:center;font-size:10px;letter-spacing:.1em;color:var(--ash);text-transform:uppercase}
#sprite{width:128px;height:128px;image-rendering:pixelated;display:block}
.acts{position:absolute;right:16px;bottom:16px;display:flex;gap:8px}
button{min-height:44px;padding:0 12px;font:inherit;font-size:14px;color:var(--parchment);background:var(--iron2);border:2px solid var(--seam2);box-shadow:0 0 0 2px var(--ink);cursor:pointer}
button[aria-pressed=true]{border-color:var(--hot);color:var(--hot)}
.panel{overflow:auto;background:var(--soot2);border-left:3px solid var(--ink);padding:12px 14px}
.filters{display:flex;gap:6px;margin-bottom:6px}.filters button{flex:1}
h3{font:600 12px system-ui;letter-spacing:.1em;text-transform:uppercase;color:var(--ash);margin:14px 0 6px}
.row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.foe{display:flex;flex-direction:column;align-items:center;padding:4px;min-height:84px;background:var(--soot)}
.foe canvas{width:52px;height:52px;image-rendering:pixelated}.foe span{font-size:11px;line-height:1.15;text-align:center;overflow:hidden;max-height:2.3em}
[hidden]{display:none!important}#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--soot);font:20px Georgia,serif}
@media (max-width:820px){.app{grid-template-columns:1fr;grid-template-rows:52vh auto;height:auto}.stage{position:sticky;top:0;z-index:2;height:52vh}#sprite{width:72px;height:72px}.inset{top:64px;bottom:auto;left:auto;right:16px}.acts{left:16px}.row{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
<div class="app"><div class="stage"><canvas id="view"></canvas>
<div class="top"><b id="name"></b><span id="what"></span></div><div id="nums"></div>
<div class="inset"><canvas id="sprite"></canvas>In the game</div>
<div class="acts"><button id="walk" aria-pressed="false">Walk</button><button id="gear" hidden>The Waking: 0</button></div></div>
<div class="panel"><div class="filters"><button id="f-all" aria-pressed="true">All 93</button><button id="f-beasts" aria-pressed="false">Beasts</button><button id="f-people" aria-pressed="false">People</button></div><div id="list"></div></div></div>
<div id="loading">Opening the bestiary…</div>
<script>/*SCRIPT*/</script>
