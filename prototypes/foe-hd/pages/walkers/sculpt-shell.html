<title>Walker Sculpts</title>
<style>
  /* one dark look on purpose, like the gallery */
  :root { color-scheme: dark; --bg: #13110e; --panel: #201b16; --ink: #f0e7d8; --dim: #b8aa92; --gold: #e2ae52; --line: #3a3027; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  body { overflow-x: hidden; }
  header { padding: 12px 16px 4px; } h1 { margin: 0; font-size: 19px; } header p { margin: 4px 0 0; color: var(--dim); font-size: 13.5px; }
  #view { display: block; width: 100%; height: 70vh; min-height: 320px; touch-action: none; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 16px 0; }
  button { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; cursor: pointer; }
  button[aria-pressed="true"] { border-color: var(--gold); background: #3a2b18; color: #ffe2b0; }
  .info { padding: 8px 16px; color: var(--dim); font-size: 13.5px; } .info b { color: var(--gold); font-variant-numeric: tabular-nums; }
  figure { margin: 8px 16px 24px; } figure img { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--line); }
</style>
<header><h1>The walkers' sculpts</h1><p>The full-detail sculpts the game's light models are baked from. Heavy: open on a laptop. Drag to turn, scroll to come close, right-drag to slide.</p></header>
<div class="bar" id="foes"></div>
<canvas id="view"></canvas>
<div class="bar"><button id="turn">Turn</button></div>
<div class="info"><span id="name"></span>: <b id="tris"></b> triangles · <span id="fps"></span></div>
<figure><img id="sheet" alt="Chris's model sheet"></figure>
<script>/*SCRIPT*/</script>
