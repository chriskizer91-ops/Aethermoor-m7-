<title>Aethermoor Gear Room</title>
<style>
:root{color-scheme:dark;--ink:#0b0910;--soot:#120e0c;--soot2:#19130f;--iron2:#2b221d;--seam:#3f3229;--seam2:#5a4838;--parchment:#ecdfc3;--ash:#a8977f;--hearth:#ee8e31;--hot:#ffcb66;--tap:44px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--soot);color:var(--parchment);font:15px/1.4 "Trebuchet MS",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
.app{display:grid;grid-template-columns:minmax(0,1fr) 380px;height:100%}
.stage{position:relative;min-height:0;overflow:hidden;background:radial-gradient(70% 60% at 50% 55%,#2c1a10 0%,#120e0c 70%)}
#view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.top{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 16px 0;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none}
.top>*{pointer-events:auto}
.title{margin-right:auto}
.title b{display:block;font-family:Georgia,serif;font-size:22px;color:#fff3d6;text-shadow:0 2px 0 #000}
.title span{font-size:11px;letter-spacing:.12em;color:var(--ash);text-transform:uppercase}
#heroes{display:flex;gap:6px;flex-wrap:wrap}
button,select{min-height:var(--tap);padding:0 12px;font:inherit;font-size:14px;color:var(--parchment);background:var(--iron2);border:2px solid var(--seam2);box-shadow:0 0 0 2px var(--ink);cursor:pointer}
button:hover:not(:disabled){border-color:var(--hearth);color:var(--hot)}
button:disabled{color:#6d6152;border-color:var(--seam);cursor:default}
button[aria-pressed=true]{border-color:var(--hot);color:var(--hot)}
.primary{color:#231306;border:0;background:linear-gradient(180deg,#ffd27a 0,#f09a36 55%,#c86a1c 100%);box-shadow:0 0 0 3px var(--ink)}
.primary:hover:not(:disabled){color:#231306}
.inset{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:rgba(18,14,12,.85);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--seam);padding:6px 8px 4px;text-align:center}
.inset .lab{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
#sprite canvas{width:128px;height:128px;display:block}
.acts{position:absolute;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));display:flex;flex-wrap:wrap;justify-content:flex-end;gap:8px;max-width:calc(100% - 180px)}
#fps{position:absolute;right:16px;top:calc(64px + env(safe-area-inset-top));font-size:11px;color:var(--ash)}
canvas.px{image-rendering:pixelated;image-rendering:crisp-edges}
.panel{background:var(--soot2);border-left:3px solid var(--ink);box-shadow:inset 2px 0 0 var(--seam);overflow:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom))}
.lab2{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ash);margin:4px 0 8px}
#slots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.slot{min-width:0}
.slot{display:flex;align-items:center;gap:8px;text-align:left;padding:4px 8px;min-height:52px;background:var(--soot)}
.slot.on{border-color:var(--hot);background:#241a12}
.ic{width:32px;height:32px;flex:none;display:grid;place-items:center;background:#0f0b09;box-shadow:inset 0 0 0 1px var(--seam)}
.tx{display:flex;flex-direction:column;min-width:0}
.sl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ash)}
.nm{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card{display:flex;gap:12px;align-items:center;margin:14px 0 10px;padding:10px;background:var(--soot);box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--seam)}
#card .pic{width:96px;height:96px;flex:none;display:grid;place-items:center;background:#0f0b09}
#card .cn{font-family:Georgia,serif;font-size:19px;line-height:1.15}
#card .cr{font-size:13px;color:var(--parchment);text-transform:capitalize}
#card .ch{font-size:12px;color:var(--ash);margin-top:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.row>*{flex:1 1 auto}
.note{font-size:12px;color:var(--ash);margin-top:12px}
[hidden]{display:none!important}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:var(--soot);font-family:Georgia,serif;font-size:20px}
@media (max-width:820px){
  .app{grid-template-columns:1fr;grid-template-rows:52vh auto;height:auto;min-height:100%}
  .stage{position:sticky;top:0;z-index:2;height:52vh}
  .panel{border-left:0;border-top:3px solid var(--ink);box-shadow:inset 0 2px 0 var(--seam)}
  .title b{font-size:18px}
  #sprite canvas{width:64px;height:64px}
  .inset{top:calc(66px + env(safe-area-inset-top));bottom:auto;left:auto;right:16px}
  .acts{left:16px;right:16px;max-width:none;flex-wrap:nowrap;justify-content:stretch}
  .acts button{flex:1 1 auto;padding:0 8px;font-size:13px}
  #fps{top:auto;right:auto;left:16px;bottom:calc(68px + env(safe-area-inset-bottom));font-size:11px;background:rgba(18,14,12,.75);padding:2px 6px;max-width:calc(100% - 32px)}
  .inset{padding:4px 6px 2px}
  .acts button{min-width:44px}
  .top button{padding:0 9px}
}
</style>
<div class="app">
  <div class="stage">
    <canvas id="view"></canvas>
    <div class="top">
      <div class="title"><b>The Gear Room</b><span>Aethermoor · a hero in 3D</span></div>
      <div id="heroes"></div>
    </div>
    <div id="fps"></div>
    <div class="inset"><div id="sprite"></div><div class="lab">In the game</div></div>
    <div class="acts"><button id="b-strike" class="primary">Swing</button><button id="b-build">Shape: storybook</button><button id="b-detail">Detail: high</button><button id="b-pixel" aria-pressed="false">Pixel look</button></div>
  </div>
  <div class="panel">
    <div class="lab2">What they wear · tap a slot</div>
    <div id="slots"></div>
    <div id="card"></div>
    <div class="row"><button id="b-roll" class="primary">Roll a new one</button><button id="b-relic">Named relic</button></div>
    <div class="row"><button id="b-temper">Temper +1 at Hilda's</button><button id="b-off">Take it off</button></div>
    <div class="lab2" style="margin-top:14px">Everything at once</div>
    <div class="row"><select id="rarity" aria-label="Rarity of new rolls"></select><button id="b-all">Roll a whole outfit</button></div>
    <div class="row"><button id="b-starter">Back to the starter kit</button></div>
    <p class="note">Every piece is built from the same numbers the game uses to draw its pixel heroes: the helmet's shape, the blade's length, the gem, the glow. Drag the hero to turn them round.</p>
  </div>
</div>
<div id="loading">Lighting the forge…</div>
<script>/*SCRIPT*/</script>
